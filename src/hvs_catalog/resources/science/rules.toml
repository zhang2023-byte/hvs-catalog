format_version = 4
title = "High-velocity star literature extraction rules"
version = "0.6.1"
review_status = "approved"
review_note = "2026-10-15，人类授权统一恒星标识术语并写入正式来源；本次仅调整 S02 措辞，科学含义不变，提取流程及提交Schema另行重构。"
instruction_language = "en"

[[rules]]
id = "S01"
title = "Use the supplied material faithfully"
text = '''Use only the supplied text and images. Extract what the authors report. Do not add unsupported information. Do not calculate or convert values. Support each extracted item with evidence from the supplied material.'''

[[rules]]
id = "S02"
title = "Select eligible stars"
text = '''Include all identifiable stars that this paper studies and that meet either contribution category below.

- **`candidates_found`**: This paper’s selection or analysis identifies the star as a Galactic unbound candidate. The authors retain this candidacy in their final assessment.
- **`follow_up`**: This paper studies the star because previous studies identified it as a Galactic unbound candidate. Include the study regardless of its current boundness conclusion.

Galactic unbound means unbound from the Milky Way in the star’s present-day state. Candidacy requires an explicit author statement, an accepted conditional possibility, or an explicit unbound criterion that the paper establishes as satisfied. Labels, proposed origins, and ejection mechanisms alone do not establish candidacy. Apply group claims only when they explicitly cover every identified member.

Record all star identifiers supported by the paper, including names. Group star identifiers under one star only when the paper supports their correspondence. Expand star identifier ranges when their members are unambiguous from the supplied material.

For Gaia star identifiers, write `Gaia`, the data release, and the numeric source ID in this order. Separate the parts with one space. If the data release is unknown, omit it. Example: `Gaia DR3 5912901375001820288`.'''

[[rules]]
id = "S03"
title = "Record reported quantities"
text = '''For each eligible star, extract all reported or adopted values for the quantities below. Include values from previous studies that this paper reports. For positions and velocities, use the star’s present-day state.

The table lists common units. Use the listed spelling for these units. You may retain other explicitly reported units.

{{quantity_table}}

`condition` describes the reported scientific context needed to interpret a value. Record each distinct result once, with its applicable condition. Do not choose a best value.

Assign group values only when the paper explicitly applies them to every identified member. Selection thresholds and sample statistics are not individual results.'''

[[rules]]
id = "S04"
title = "Resolve ambiguities and record necessary notes"
text = '''Identify printing errors or logical contradictions only from evidence in the paper. Omit only the affected content. Ambiguity means the material supports multiple interpretations. Follow the paper’s explicit definitions. Otherwise, use the established interpretation in the relevant scientific field. Briefly describe consequential issues, evidence, and decisions in `notes`.'''

[[quantities]]
ids = ["ra"]
definition = "Equatorial right ascension."
common_units = "`deg`, `rad`, `hourangle`"

[[quantities]]
ids = ["dec"]
definition = "Equatorial declination."
common_units = "`deg`, `rad`"

[[quantities]]
ids = ["distance"]
definition = "Heliocentric distance of the star."
common_units = "`pc`, `kpc`, `mag` for distance modulus"

[[quantities]]
ids = ["parallax"]
definition = "Annual parallax of the star."
common_units = "`mas`, `arcsec`, `μas`"

[[quantities]]
ids = ["proper_motion_ra", "proper_motion_dec"]
definition = "Equatorial proper-motion components."
common_units = "`mas/yr`, `arcsec/yr`"

[[quantities]]
ids = ["radial_velocity"]
definition = "Heliocentric or barycentric line-of-sight velocity. Exclude velocities relative to the local or Galactic standard of rest."
common_units = "`km/s`, `m/s`"

[[quantities]]
ids = ["galactocentric_radius"]
definition = "Three-dimensional distance to the Galactic center, excluding cylindrical radius."
common_units = "`pc`, `kpc`"

[[quantities]]
ids = ["galactic_rest_frame_velocity"]
definition = "The star’s total three-dimensional speed in the Galactic rest frame."
common_units = "`km/s`, `m/s`"

[[quantities]]
ids = ["bound_probability", "unbound_probability"]
definition = "Probability that the star is bound to or unbound from the Milky Way, respectively."
common_units = "dimensionless, `%`"
