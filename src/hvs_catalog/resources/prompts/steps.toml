instruction_language = "en"

[steps.roster]
task = "Identify the complete roster of eligible objects and this paper's contributions. Apply the scientific rules, preserve the authors' assessments and evidence, record exclusions, source-error diagnostics and material gaps, and choose the best-supported interpretation of ambiguous wording."
explanations = ["S01", "S02", "S03", "S04", "S06", "S07"]
definitions = ["states"]
examples = ["E01", "E04", "E05", "E07", "E08", "E12", "E13", "E19"]
format = "roster"

[steps.quantities]
task = "For the supplied roster objects, collect all reported or adopted values in the approved quantity scope. Preserve original representations, units, errors, conditions and evidence. Keep distinct results separate and report unresolved numerical conflicts and incomplete coverage. Use the supplied identities and inclusion decisions; report any contradictory evidence rather than silently changing them."
explanations = ["S01", "S02", "S05", "S06", "S07"]
definitions = ["quantities"]
examples = ["E12", "E13", "E14", "E15", "E16", "E17", "E18", "E19"]
format = "quantity"

