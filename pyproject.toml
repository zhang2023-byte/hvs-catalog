[project]
name = "hvs-catalog"
version = "0.1.0"
description = "从高速星研究文献整理对象、判断与测量值，形成可回查依据的星表系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy>=6.1",
    "astroquery>=0.4.10,<0.5",
    "beautifulsoup4>=4.12",
    "jsonschema>=4.25,<5",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "pypdf>=5.1",
    "pyyaml>=6.0",
    "requests>=2.32",
    "urllib3>=2.0",
]

[project.scripts]
hvs-catalog = "hvs_catalog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=8.3",
    "reportlab>=4.0",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hvs_catalog"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/hvs_catalog",
    "/pyproject.toml",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 离线原生转换、真实进程退出或竞争、本机 HTTP 和实时时钟边界",
]

[tool.ruff]
extend-exclude = [".work"]
